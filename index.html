  <style>
    /* ============================================================
       RESET & THEME
       ============================================================ */
    :root {
      --bg: #0f0f0f;
      --surface: #212121;
      --surface-2: #181818;
      --surface-3: #272727;
      --text: #f1f1f1;
      --text-dim: #aaaaaa;
      --text-mute: #717171;
      --accent: #ff0033;
      --border: #303030;
      --radius: 12px;
      --radius-sm: 8px;
      --nav-h: 56px;
      --transition: 0.2s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100%;
    }

    body { overflow-x: hidden; }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }

    /* ============================================================
       TOP AD BAR
       ============================================================ */
    .top-ad-bar {
      width: 100%;
      background: #050505;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 14px;
      position: relative;
      z-index: 60;
    }
    .top-ad-bar .ad-unit {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      max-width: 100%;
      min-height: 60px;
    }
    .top-ad-bar .ad-label {
      font-size: 0.58rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-mute);
      position: absolute;
      top: 2px;
      left: 8px;
      pointer-events: none;
    }
    .top-ad-bar .ad-unit iframe { max-width: 100%; border: 0; }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
      flex-shrink: 0;
      user-select: none;
    }
    .brand .logo-mark {
      width: 32px;
      height: 22px;
      border-radius: 5px;
      background: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .brand .logo-mark i { font-size: 0.7rem; color: #fff; }
    .brand .brand-name { color: #fff; }

    .search-form {
      flex: 1;
      display: flex;
      max-width: 640px;
      margin: 0 auto;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 40px;
      overflow: hidden;
      background: var(--surface-2);
    }
    .search-form input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      padding: 0 18px;
      font-size: 0.95rem;
    }
    .search-form input::placeholder { color: var(--text-mute); }
    .search-form button {
      width: 64px;
      background: var(--surface-3);
      border-left: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      display: grid;
      place-items: center;
      transition: background var(--transition);
    }
    .search-form button:hover { background: #333; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1rem;
      color: var(--text);
      transition: background var(--transition);
    }
    .icon-btn:hover { background: var(--surface-3); }

    /* ============================================================
       MAIN LAYOUT
       ============================================================ */
    .main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 20px 80px;
    }

    .section-heading {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-heading i { color: var(--accent); font-size: 1rem; }

    /* ============================================================
       VIDEO GRID
       ============================================================ */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px 16px;
    }

    .video-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform var(--transition);
    }
    .video-card:hover .thumb { transform: scale(1.02); }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface-2);
    }
    .thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .thumb-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2a1520, #131313);
      color: var(--accent);
      font-size: 2.2rem;
    }
    .thumb-duration {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .thumb-play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.0);
      transition: background var(--transition);
    }
    .video-card:hover .thumb-play { background: rgba(0,0,0,0.25); }
    .thumb-play i {
      font-size: 2.6rem;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      opacity: 0;
      transform: scale(0.85);
      transition: opacity var(--transition), transform var(--transition);
    }
    .video-card:hover .thumb-play i { opacity: 1; transform: scale(1); }

    .card-info {
      display: flex;
      gap: 12px;
      padding: 12px 4px 0;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #ff5b7a);
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .card-meta { flex: 1; min-width: 0; }
    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .card-channel {
      font-size: 0.8rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-channel i { font-size: 0.65rem; }
    .card-stats { font-size: 0.78rem; color: var(--text-mute); margin-top: 2px; }

    .card-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .mini-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      color: var(--text-dim);
      transition: background var(--transition), color var(--transition);
    }
    .mini-btn:hover { background: var(--surface-3); color: #fff; }
    .mini-btn.liked { color: var(--accent); }
    .mini-btn.saved { color: #3ea6ff; }

    /* ============================================================
       INLINE FEED AD
       ============================================================ */
    .feed-ad {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 16px;
      background: #0a0a0a;
      border: 1px solid #1e1e1e;
      border-radius: var(--radius);
      margin: 8px 0;
    }
    .feed-ad-label {
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-mute);
    }
    .feed-ad-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 60px;
      overflow: hidden;
    }

    /* ============================================================
       PLAYER OVERLAY
       ============================================================ */
    .player-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.92);
      display: none;
      overflow-y: auto;
      padding: 20px;
    }
    .player-overlay.open { display: block; }

    .player-shell {
      max-width: 1100px;
      margin: 0 auto;
    }
    .player-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }
    .player-topbar .pt-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .player-close {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      color: #fff;
      background: var(--surface-3);
      flex-shrink: 0;
      transition: background var(--transition);
    }
    .player-close:hover { background: #444; }

    .player-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
    }
    .player-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .player-frame .player-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: var(--text-dim);
      font-size: 0.9rem;
      gap: 10px;
      flex-direction: column;
    }

    .player-info {
      margin-top: 16px;
      padding: 0 4px;
    }
    .player-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .player-sub {
      font-size: 0.85rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .player-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .action-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 50px;
      background: var(--surface-3);
      font-size: 0.85rem;
      font-weight: 500;
      transition: background var(--transition);
    }
    .action-pill:hover { background: #3a3a3a; }
    .action-pill.active { background: #fff; color: #000; }
    .action-pill.active i { color: var(--accent); }

    .player-desc {
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--text-dim);
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .player-ads {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
      padding: 12px;
      background: #0a0a0a;
      border: 1px solid #1e1e1e;
      border-radius: var(--radius);
    }
    .player-ads .ad-unit {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      max-width: 100%;
    }
    .player-ads .ad-unit iframe { border: 0; max-width: 100%; }

    /* ============================================================
       SPINNER / STATES
       ============================================================ */
    .spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .state-block {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 60px 20px;
      text-align: center;
    }
    .state-block .state-title { font-size: 1.05rem; font-weight: 700; }
    .state-block .state-text { font-size: 0.85rem; color: var(--text-dim); max-width: 380px; line-height: 1.55; }

    .btn-pill {
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 600;
      background: #fff;
      color: #000;
      transition: transform var(--transition);
    }
    .btn-pill:hover { transform: scale(1.04); }
    .btn-pill.ghost { background: var(--surface-3); color: #fff; }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast-wrap {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition), transform var(--transition);
    }
    .toast-wrap.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast {
      background: #fff;
      color: #000;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 12px 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
    }
    .toast i { color: var(--accent); }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 720px) {
      .search-form { display: none; }
      .main { padding: 14px 12px 70px; }
      .video-grid { grid-template-columns: 1fr; gap: 18px; }
      .player-overlay { padding: 12px; }
      .top-ad-bar { gap: 8px; padding: 8px; }
    }

    @media (max-width: 480px) {
      .header { padding: 0 10px; gap: 10px; }
      .brand .brand-name { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    :focus-visible { outline: 2px solid #3ea6ff; outline-offset: 2px; border-radius: 4px; }
  </style>
</head>

    const state = {
      items: [],
      page: 0,
      loading: false,
      exhausted: false,
      query: '',
      liked: new Set(),
      saved: new Map(),
      currentItem: null,
      requestSeq: 0,
      ytApiOk: true,
      ytApiErrorMsg: ''
    };

    /* ==========================================================
       DOM
       ========================================================== */
    const $ = (s, c = document) => c.querySelector(s);
    const $$ = (s, c = document) => Array.from(c.querySelectorAll(s));

    const gridEl       = $('#videoGrid');
    const headingEl    = $('#sectionHeading');
    const searchForm   = $('#searchForm');
    const searchInput  = $('#searchInput');
    const overlay      = $('#playerOverlay');
    const playerFrame  = $('#playerFrame');
    const ptTitle      = $('#ptTitle');
    const playerTitle  = $('#playerTitle');
    const playerSub    = $('#playerSub');
    const playerDesc   = $('#playerDesc');
    const pLikeBtn     = $('#pLikeBtn');
    const pLikeLabel   = $('#pLikeLabel');
    const pSaveBtn     = $('#pSaveBtn');
    const pSaveLabel   = $('#pSaveLabel');
    const pShareBtn    = $('#pShareBtn');
    const pSourceBtn   = $('#pSourceBtn');
    const toastWrap    = $('#toastWrap');
    const toastText    = $('#toastText');

    /* ==========================================================
       HELPERS
       ========================================================== */
    function showToast(msg, icon) {
      toastText.textContent = msg;
      const i = $('#toast i');
      if (i && icon) i.className = 'fas ' + icon;
      toastWrap.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastWrap.classList.remove('show'), 3000);
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function loadSet(k) { try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch { return new Set(); } }
    function loadMap(k) { try { return new Map(JSON.parse(localStorage.getItem(k) || '[]')); } catch { return new Map(); } }
    function saveSet(k, s) { try { localStorage.setItem(k, JSON.stringify(Array.from(s))); } catch {} }
    function saveMap(k, m) { try { localStorage.setItem(k, JSON.stringify(Array.from(m.entries()))); } catch {} }

    state.liked = loadSet(STORAGE_KEYS.likes);
    state.saved = loadMap(STORAGE_KEYS.saved);

    function withTimeout(p, ms) {
      return new Promise((res, rej) => {
        const t = setTimeout(() => rej(new Error('Request timed out')), ms);
        p.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
      });
    }

    async function fetchJSON(url) {
      const r = await withTimeout(fetch(url), 12000);
      if (!r.ok) {
        let d = '';
        let code = r.status;
        try {
          const j = await r.json();
          d = j?.error?.message || j?.status_message || '';
        } catch {}
        const err = new Error('HTTP ' + code + (d ? ' — ' + d : ''));
        err.status = code;
        throw err;
      }
      return r.json();
    }

    function ytThumb(id) { return 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'; }
    function tmdbImg(path, size) { return path ? TMDB_IMG_URL + (size || 'w500') + path : null; }

    /* ==========================================================
       YOUTUBE SEARCH
       ========================================================== */
    async function youtubeSearch(query, max) {
      if (!state.ytApiOk) {
        throw new Error('YouTube API is disabled after a previous failure: ' + state.ytApiErrorMsg);
      }
      const url = YOUTUBE_SEARCH_URL
        + '?part=snippet&type=video&maxResults=' + (max || 12)
        + '&videoEmbeddable=true'
        + '&q=' + encodeURIComponent(query)
        + '&key=' + YOUTUBE_API_KEY;

      try {
        const data = await fetchJSON(url);
        if (!data.items || !data.items.length) return [];
        return data.items
          .filter(it => it.id && it.id.videoId)
          .map(it => ({
            key: 'yt-' + it.id.videoId,
            source: 'youtube',
            id: it.id.videoId,
            title: it.snippet.title || 'Untitled',
            desc: it.snippet.description || '',
            thumb: it.snippet.thumbnails?.high?.url || it.snippet.thumbnails?.medium?.url || ytThumb(it.id.videoId),
            channel: it.snippet.channelTitle || '',
            published: it.snippet.publishedAt || '',
            ytId: it.id.videoId
          }));
      } catch (e) {
        if (e.status === 400 || e.status === 403) {
          state.ytApiOk = false;
          state.ytApiErrorMsg = e.message;
          console.error(
            '[ClipFlow] YouTube API rejected this request.\n' +
            'Reason: ' + e.message + '\n' +
            'Likely cause: the API key is restricted to other domains, has YouTube Data API v3 disabled, ' +
            'or the daily quota is exhausted.\n' +
            'Fix: Google Cloud Console → APIs & Services → Credentials → click your key → ' +
            'set Application restrictions to "None" or add this site to HTTP referrers, and ensure ' +
            '"YouTube Data API v3" is enabled under API restrictions.'
          );
        }
        throw e;
      }
    }

    /* ==========================================================
       TMDB trailer lookup (no YouTube API needed)
       ========================================================== */
    async function tmdbTrailerKey(movieId) {
      try {
        const data = await fetchJSON(
          TMDB_BASE_URL + '/movie/' + movieId + '/videos?api_key=' + TMDB_API_KEY
        );
        const results = data.results || [];
        const pick = results.find(r => r.site === 'YouTube' && r.type === 'Trailer' && r.official)
                  || results.find(r => r.site === 'YouTube' && r.type === 'Trailer')
                  || results.find(r => r.site === 'YouTube' && r.type === 'Teaser')
                  || results.find(r => r.site === 'YouTube');
        return pick ? pick.key : null;
      } catch (e) {
        console.warn('[ClipFlow] TMDB trailer lookup failed:', e.message);
        return null;
      }
    }

    /* ==========================================================
       TMDB SEARCH / POPULAR
       ========================================================== */
    async function tmdbPopular(page) {
      return fetchJSON(TMDB_BASE_URL + '/movie/popular?api_key=' + TMDB_API_KEY + '&page=' + (page || 1));
    }

    async function tmdbSearch(query) {
      return fetchJSON(TMDB_BASE_URL + '/search/movie?api_key=' + TMDB_API_KEY
        + '&query=' + encodeURIComponent(query) + '&page=1');
    }

    function tmdbToItem(m) {
      return {
        key: 'tmdb-' + m.id,
        source: 'tmdb',
        id: m.id,
        title: m.title || m.name || 'Untitled',
        desc: m.overview || 'No description available.',
        thumb: tmdbImg(m.poster_path, 'w500') || tmdbImg(m.backdrop_path, 'w780'),
        channel: 'Movie',
        year: (m.release_date || '').slice(0, 4),
        rating: m.vote_average,
        ytId: null
      };
    }

    /* ==========================================================
       OFFLINE FALLBACK
       ========================================================== */
    const OFFLINE = [
      { key:'off-1', source:'youtube', title:'Big Buck Bunny — Open Movie', desc:'A classic open animation short by the Blender Foundation.', thumb:'https://peach.blender.org/wp-content/uploads/title_anouncement.jpg', channel:'Blender', ytId:'aqz-KE-bpKQ', id:'aqz-KE-bpKQ' },
      { key:'off-2', source:'youtube', title:'Sintel — Open Movie', desc:'A beautiful open animation film from the Blender Foundation.', thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Sintel_poster.jpg/640px-Sintel_poster.jpg', channel:'Blender', ytId:'eRsGyueVLvQ', id:'eRsGyueVLvQ' },
      { key:'off-3', source:'youtube', title:'Tears of Steel — Open Movie', desc:'A sci-fi short film created with open tools.', thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Tos-poster.png/640px-Tos-poster.png', channel:'Blender', ytId:'R6MlUcmOul8', id:'R6MlUcmOul8' },
      { key:'off-4', source:'youtube', title:'Elephants Dream — Open Movie', desc:'The first open movie project by the Blender Foundation.', thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Elephants_Dream_poster.jpg/640px-Elephants_Dream_poster.jpg', channel:'Blender', ytId:'TLkA0RELQ1g', id:'TLkA0RELQ1g' },
      { key:'off-5', source:'youtube', title:'Cosmos Laundromat — First Cycle', desc:'A whimsical open animation short.', thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Cosmos_Laundromat_poster.jpg/640px-Cosmos_Laundromat_poster.jpg', channel:'Blender', ytId:'Y-rmzh0PI3c', id:'Y-rmzh0PI3c' },
      { key:'off-6', source:'youtube', title:'Spring — Blender Open Movie', desc:'A poetic open animation short.', thumb:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Spring_poster.jpg/640px-Spring_poster.jpg', channel:'Blender', ytId:'WhWc3b3KhnY', id:'WhWc3b3KhnY' }
    ];

    /* ==========================================================
       LOAD FEED
       ========================================================== */
    async function loadFeed(reset) {
      if (state.loading) return;
      if (!reset && state.exhausted) return;

      const seq = ++state.requestSeq;
      state.loading = true;

      if (reset) {
        state.items = [];
        state.page = 0;
        state.exhausted = false;
        gridEl.innerHTML = '';
        renderState('loading', 'Loading videos…');
      } else {
        renderState('loading-more', 'Loading more videos…');
      }

      try {
        let batch = [];

        if (state.ytApiOk) {
          try {
            const q = state.query || 'trending video';
            const yt = await youtubeSearch(q, PAGE_SIZE);
            batch = batch.concat(yt);
          } catch (e) {
            console.warn('[ClipFlow] YouTube skipped:', e.message);
          }
        }

        if (!state.query) {
          try {
            const tmdb = await tmdbPopular(state.page + 1);
            const movies = (tmdb.results || []).slice(0, 8).map(tmdbToItem);
            batch = batch.concat(movies);
          } catch (e) {
            console.warn('[ClipFlow] TMDB error:', e.message);
          }
        }

        if (!batch.length && state.page === 0) {
          batch = OFFLINE.slice();
          showToast('Showing sample videos', 'fa-wifi');
        }

        if (seq !== state.requestSeq) return;

        if (!batch.length) {
          state.exhausted = true;
          clearState();
          renderExhausted();
          return;
        }

        state.items = state.items.concat(batch);
        state.page += 1;

        clearState();
        renderCards(batch, !reset);
      } catch (err) {
        console.error(err);
        clearState();
        if (state.items.length === 0) {
          renderState('error', 'Could not load videos', err.message);
        } else {
          showToast('Could not load more videos', 'fa-triangle-exclamation');
        }
      } finally {
        state.loading = false;
      }
    }

    /* ==========================================================
       RENDER CARDS
       ========================================================== */
    function renderCards(items, append) {
      if (!append) gridEl.innerHTML = '';

      items.forEach((item, i) => {
        gridEl.appendChild(createCard(item));
        if ((state.items.length - items.length + i + 1) % 6 === 0) {
          gridEl.appendChild(createFeedAd());
        }
      });

      setupScrollLoad();
    }

    function createCard(item) {
      const card = document.createElement('article');
      card.className = 'video-card';
      card.dataset.key = item.key;

      const isLiked = state.liked.has(item.key);
      const isSaved = state.saved.has(item.key);
      const initial = (item.channel || item.title || '?').charAt(0).toUpperCase();

      card.innerHTML = `
        <div class="thumb-wrap">
          ${item.thumb
            ? `<img class="thumb" src="${esc(item.thumb)}" alt="${esc(item.title)}" loading="lazy" onerror="this.style.display='none'">`
            : `<div class="thumb-fallback"><i class="fas fa-film"></i></div>`}
          <div class="thumb-play"><i class="fas fa-play"></i></div>
          ${item.source === 'tmdb' ? `<span class="thumb-duration">MOVIE</span>` : ''}
        </div>
        <div class="card-info">
          <div class="avatar">${esc(initial)}</div>
          <div class="card-meta">
            <h3 class="card-title">${esc(item.title)}</h3>
            <div class="card-channel">
              ${esc(item.channel || 'ClipFlow')}
              ${item.source === 'tmdb' ? '<i class="fas fa-circle-check" title="Verified"></i>' : ''}
            </div>
            <div class="card-stats">
              ${item.year ? item.year + ' · ' : ''}
              ${item.rating != null ? '★ ' + Number(item.rating).toFixed(1) : ''}
              ${item.source === 'youtube' && !item.year ? 'YouTube' : ''}
            </div>
            <div class="card-actions">
              <button class="mini-btn ${isLiked ? 'liked' : ''}" data-action="like" aria-label="Like">
                <i class="fas fa-thumbs-up"></i>
              </button>
              <button class="mini-btn ${isSaved ? 'saved' : ''}" data-action="save" aria-label="Save">
                <i class="fas fa-bookmark"></i>
              </button>
              <button class="mini-btn" data-action="share" aria-label="Share">
                <i class="fas fa-share-nodes"></i>
              </button>
            </div>
          </div>
        </div>
      `;

      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-action]')) return;
        openPlayer(item);
      });

      card.querySelector('[data-action="like"]').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLike(item, card);
      });
      card.querySelector('[data-action="save"]').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSave(item, card);
      });
      card.querySelector('[data-action="share"]').addEventListener('click', (e) => {
        e.stopPropagation();
        shareItem(item);
      });

      return card;
    }

    function createFeedAd() {
      const wrap = document.createElement('div');
      wrap.className = 'feed-ad';
      wrap.innerHTML = `
        <div class="feed-ad-label">Advertisement</div>
        <div class="feed-ad-slot">
          <script>
          atOptions = { 'key':'dc7030c4f07ac81c911e234132561496', 'format':'iframe', 'height':60, 'width':468, 'params':{} };
          <\/script>
          <script src="https://bauval.org/22/dc7030c4f07ac81c911e234132561496"><\/script>
        </div>
      `;
      wrap.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if (old.src) { s.src = old.src; s.async = false; }
        else { s.textContent = old.textContent; }
        old.parentNode.replaceChild(s, old);
      });
      return wrap;
    }

    /* ==========================================================
       STATE HELPERS
       ========================================================== */
    function renderState(type, text, detail) {
      $$('.state-block', gridEl).forEach(n => n.remove());
      const el = document.createElement('div');
      el.className = 'state-block';
      if (type === 'error') {
        el.innerHTML = `
          <i class="fas fa-triangle-exclamation" style="font-size:2rem;color:var(--accent)"></i>
          <div class="state-title">${esc(text)}</div>
          <div class="state-text">${esc(detail || 'Please try again.')}</div>
          <button class="btn-pill" onclick="location.reload()">Reload</button>`;
      } else {
        el.innerHTML = `<div class="spinner"></div><div class="state-text">${esc(text)}</div>`;
      }
      gridEl.appendChild(el);
    }

    function clearState() {
      $$('.state-block', gridEl).forEach(n => n.remove());
    }

    function renderExhausted() {
      if ($('#feedEnd', gridEl)) return;
      const el = document.createElement('div');
      el.className = 'state-block';
      el.id = 'feedEnd';
      el.innerHTML = `
        <div class="state-title">You've reached the end</div>
        <div class="state-text">Refresh for more videos.</div>
        <button class="btn-pill" onclick="location.reload()">Refresh</button>`;
      gridEl.appendChild(el);
    }

    /* ==========================================================
       SCROLL LOAD
       ========================================================== */
    let scrollLoadBound = false;
    function setupScrollLoad() {
      if (scrollLoadBound) return;
      scrollLoadBound = true;
      window.addEventListener('scroll', () => {
        if (state.loading || state.exhausted) return;
        const nearBottom = (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 600);
        if (nearBottom) loadFeed(false);
      }, { passive: true });
    }

    /* ==========================================================
       PLAYER
       ========================================================== */
    function openPlayer(item) {
      state.currentItem = item;

      playerFrame.innerHTML = `
        <div class="player-loading">
          <div class="spinner"></div>
          <div>Loading video…</div>
        </div>`;

      if (item.ytId) {
        mountPlayer(item.ytId);
      } else if (item.source === 'tmdb') {
        playerFrame.innerHTML = `
          <div class="player-loading">
            <div class="spinner"></div>
            <div>Finding trailer…</div>
          </div>`;
        tmdbTrailerKey(item.id).then(key => {
          if (state.currentItem && state.currentItem.key === item.key) {
            if (key) {
              state.currentItem.ytId = key;
              mountPlayer(key);
            } else {
              if (state.ytApiOk) {
                const q = (item.title || '') + ' official trailer';
                youtubeSearch(q, 1).then(results => {
                  if (results.length && state.currentItem && state.currentItem.key === item.key) {
                    state.currentItem.ytId = results[0].ytId;
                    mountPlayer(results[0].ytId);
                  } else {
                    showNoTrailer(item);
                  }
                }).catch(() => showNoTrailer(item));
              } else {
                showNoTrailer(item);
              }
            }
          }
        });
      } else {
        playerFrame.innerHTML = `
          <div class="player-loading">
            <i class="fas fa-film" style="font-size:2rem;color:var(--text-mute)"></i>
            <div>No playable video for this item.</div>
          </div>`;
      }

      ptTitle.textContent = item.title;
      playerTitle.textContent = item.title;
      playerSub.innerHTML = [
        item.channel ? `<span><i class="fas fa-user"></i> ${esc(item.channel)}</span>` : '',
        item.year ? `<span><i class="fas fa-calendar"></i> ${esc(item.year)}</span>` : '',
        item.rating != null ? `<span><i class="fas fa-star"></i> ${Number(item.rating).toFixed(1)}</span>` : '',
        item.source === 'youtube' ? '<span><i class="fab fa-youtube" style="color:#ff0000"></i> YouTube</span>' : ''
      ].filter(Boolean).join('');

      playerDesc.textContent = item.desc || 'No description available.';

      const isLiked = state.liked.has(item.key);
      const isSaved = state.saved.has(item.key);
      pLikeBtn.classList.toggle('active', isLiked);
      pLikeLabel.textContent = isLiked ? 'Liked' : 'Like';
      pSaveBtn.classList.toggle('active', isSaved);
      pSaveLabel.textContent = isSaved ? 'Saved' : 'Save';

      if (item.source === 'youtube' && item.ytId) {
        pSourceBtn.href = 'https://www.youtube.com/watch?v=' + item.ytId;
        pSourceBtn.style.display = 'inline-flex';
      } else if (item.source === 'tmdb') {
        pSourceBtn.href = 'https://www.themoviedb.org/movie/' + item.id;
        pSourceBtn.style.display = 'inline-flex';
      } else {
        pSourceBtn.style.display = 'none';
      }

      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function showNoTrailer(item) {
      playerFrame.innerHTML = `
        <div class="player-loading">
          <i class="fas fa-film" style="font-size:2rem;color:var(--text-mute)"></i>
          <div style="text-align:center;max-width:340px;line-height:1.5;">
            No trailer available for this movie.
            <a href="https://www.themoviedb.org/movie/${item.id}" target="_blank" rel="noopener" style="color:#3ea6ff;">View details →</a>
          </div>
        </div>`;
    }

    function mountPlayer(ytId) {
      const params = new URLSearchParams({
        autoplay: '1',
        rel: '0',
        playsinline: '1',
        modestbranding: '1',
        enablejsapi: '1',
        origin: location.origin
      });
      const src = YT_EMBED_BASE + ytId + '?' + params.toString();

      const iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.title = 'Video player';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = 'strict-origin-when-cross-origin';

      const fallbackTimer = setTimeout(() => {
        const loading = playerFrame.querySelector('.player-loading');
        if (loading) {
          loading.innerHTML = `
            <i class="fas fa-circle-exclamation" style="font-size:2rem;color:var(--accent)"></i>
            <div style="text-align:center;max-width:340px;line-height:1.5;">
              This video cannot be embedded.
              <a href="https://www.youtube.com/watch?v=${esc(ytId)}" target="_blank" rel="noopener" style="color:#3ea6ff;">Watch on YouTube →</a>
            </div>`;
        }
      }, 8000);

      iframe.addEventListener('load', () => {
        clearTimeout(fallbackTimer);
        const loading = playerFrame.querySelector('.player-loading');
        if (loading) loading.remove();
      });

      playerFrame.innerHTML = '';
      playerFrame.appendChild(iframe);
    }

    function closePlayer() {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      playerFrame.innerHTML = '';
      state.currentItem = null;
    }

    /* ==========================================================
       LIKE / SAVE / SHARE
       ========================================================== */
    function toggleLike(item, card) {
      const btn = card ? card.querySelector('[data-action="like"]') : null;
      if (state.liked.has(item.key)) {
        state.liked.delete(item.key);
        if (btn) btn.classList.remove('liked');
        showToast('Removed like', 'fa-thumbs-down');
      } else {
        state.liked.add(item.key);
        if (btn) btn.classList.add('liked');
        showToast('Liked', 'fa-thumbs-up');
      }
      saveSet(STORAGE_KEYS.likes, state.liked);
      if (state.currentItem && state.currentItem.key === item.key) {
        const isLiked = state.liked.has(item.key);
        pLikeBtn.classList.toggle('active', isLiked);
        pLikeLabel.textContent = isLiked ? 'Liked' : 'Like';
      }
    }

    function toggleSave(item, card) {
      const btn = card ? card.querySelector('[data-action="save"]') : null;
      if (state.saved.has(item.key)) {
        state.saved.delete(item.key);
        if (btn) btn.classList.remove('saved');
        showToast('Removed from saved', 'fa-bookmark');
      } else {
        state.saved.set(item.key, item);
        if (btn) btn.classList.add('saved');
        showToast('Saved', 'fa-bookmark');
      }
      saveMap(STORAGE_KEYS.saved, state.saved);
      if (state.currentItem && state.currentItem.key === item.key) {
        const isSaved = state.saved.has(item.key);
        pSaveBtn.classList.toggle('active', isSaved);
        pSaveLabel.textContent = isSaved ? 'Saved' : 'Save';
      }
    }

    function shareItem(item) {
      const url = item.source === 'youtube' && item.ytId
        ? 'https://www.youtube.com/watch?v=' + item.ytId
        : (item.source === 'tmdb'
            ? 'https://www.themoviedb.org/movie/' + item.id
            : location.href);
      const payload = { title: item.title, text: 'Watch on ClipFlow: ' + item.title, url };
      if (navigator.share) {
        navigator.share(payload).catch(() => copyShare(url));
      } else {
        copyShare(url);
      }
    }
    function copyShare(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
          .then(() => showToast('Link copied', 'fa-copy'))
          .catch(() => showToast('Could not copy', 'fa-triangle-exclamation'));
      } else {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast('Link copied', 'fa-copy'); }
        catch { showToast('Could not copy', 'fa-triangle-exclamation'); }
        ta.remove();
      }
    }

    /* ==========================================================
       EVENT WIRING
       ========================================================== */
    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (!q) return;
      state.query = q;
      headingEl.innerHTML = `<i class="fas fa-search"></i> Results for "${esc(q)}"`;
      loadFeed(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { searchInput.value = ''; }
    });

    $('#refreshBtn').addEventListener('click', () => {
      state.query = '';
      searchInput.value = '';
      headingEl.innerHTML = `<i class="fas fa-fire"></i> Recommended`;
      loadFeed(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $('#savedBtn').addEventListener('click', () => {
      if (!state.saved.size) {
        showToast('No saved videos yet', 'fa-bookmark');
        return;
      }
      state.query = '__SAVED__';
      headingEl.innerHTML = `<i class="fas fa-bookmark"></i> Saved Videos`;
      state.items = Array.from(state.saved.values());
      gridEl.innerHTML = '';
      renderCards(state.items, false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $('#playerClose').addEventListener('click', closePlayer);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closePlayer();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closePlayer();
    });

    pLikeBtn.addEventListener('click', () => {
      if (state.currentItem) toggleLike(state.currentItem, null);
    });
    pSaveBtn.addEventListener('click', () => {
      if (state.currentItem) toggleSave(state.currentItem, null);
    });
    pShareBtn.addEventListener('click', () => {
      if (state.currentItem) shareItem(state.currentItem);
    });

    /* ==========================================================
       INIT
       ========================================================== */
    loadFeed(true);
  })();
  </script>
</body>
</html>
